repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: no-secrets
        name: block API keys and private calendar URLs
        entry: python scripts/check_secrets.py
        language: system
        types: [text]
      - id: forbid-env-and-db
        name: block .env and database files
        entry: .env files and SQLite databases must never be committed
        language: fail
        files: (^|/)\.env$|\.(db|sqlite3?)$
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
